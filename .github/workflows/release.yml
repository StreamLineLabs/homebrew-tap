name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate formula
        run: |
          if grep -q 'sha256 "PLACEHOLDER_SHA256' streamline.rb; then
            echo "::error::Formula still contains placeholder SHA256 hashes"
            exit 1
          fi
          ./scripts/validate-formula.sh
          brew install streamlinelabs/test/streamline
          brew test streamlinelabs/test/streamline

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
